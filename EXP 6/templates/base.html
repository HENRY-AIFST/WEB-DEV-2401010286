<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NEXUS — Contacts{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Cabinet+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>

  <!-- Animated background orbs -->
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Grid overlay -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="navbar-inner">
      <a href="{{ url_for('index') }}" class="brand">
        <div class="brand-logo">
          <span class="logo-hex">⬡</span>
          <span class="logo-dot"></span>
        </div>
        <div class="brand-name">
          <span class="brand-title">NEXUS</span>
          <span class="brand-sub">Contact OS</span>
        </div>
      </a>

      <nav class="nav-links">
        <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="{{ url_for('add_contact') }}" class="nav-link nav-cta {% if request.endpoint == 'add_contact' %}active{% endif %}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Contact
        </a>
      </nav>
    </div>
  </header>

  <!-- FLASH MESSAGES -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-zone">
        {% for cat, msg in messages %}
          <div class="flash flash-{{ cat }}">
            <span class="flash-pip"></span>
            <span class="flash-text">{{ msg }}</span>
            <button class="flash-close" onclick="this.parentElement.remove()">✕</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <!-- MAIN -->
  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer-logo">⬡ NEXUS</span>
    <span class="footer-divider">|</span>
    <span>Contact OS &copy; 2026</span>
    <span class="footer-divider">|</span>
    <span>Built with Flask</span>
  </footer>

  <!-- APPLICATION SCRIPT -->
  <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
